<!DOCTYPE html>

  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try {
      var queryTheme = new URLSearchParams(location.search).get('theme');
      var savedTheme = queryTheme || localStorage.getItem('site-theme');
      if (savedTheme === 'mint' || savedTheme === 'japanese') savedTheme = 'red';
      if (savedTheme !== 'red' && savedTheme !== 'noir') savedTheme = 'red';
      document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) {}
  </script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/art.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/ctf.js" defer></script>
</head>
